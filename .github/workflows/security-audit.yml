name: security-audit

# Weekly dependency audit (2026-11-07, the owner: security scanning). Scheduled and by hand
# only, never on pull requests, so it cannot block a merge: a finding turns this run red and
# lists itself in the run summary; the fix goes through a normal pull request.
on:
  schedule:
    - cron: "17 1 * * 1"      # Monday 01:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (the package)
        run: |
          python -m venv "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/app/bin/pip" install -q .
          "$RUNNER_TEMP/app/bin/pip" freeze --exclude-editable | grep -v '^-e ' > "$RUNNER_TEMP/req.txt"
          pip install -q pip-audit
          set -o pipefail
          pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip --desc 2>&1 | tee "$RUNNER_TEMP/out.txt"
          rc=${PIPESTATUS[0]}
          { echo '### pip-audit (the package)'; echo '```'; cat "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
