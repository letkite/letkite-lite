# /etc/vpsmcp/hosts.yaml
#
# Hand-written entries only. Enrolled nodes are written to hosts.d/<node_id>.yaml
# by the service; both files are loaded together and hot-reloaded on change.
#
# Identity is node_id (address:port:user). Aliases are labels and may repeat.

defaults:
  user: ops
  port: 22
  scopes: [fleet.read, fleet.exec, fleet.write]
  env:
    LANG: C.UTF-8
    TERM: dumb

hosts: []

